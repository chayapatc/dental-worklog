server {
    listen 80;
    server_name 35.253.110.126 35-253-110-126.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 35.253.110.126 35-253-110-126.nip.io;

    ssl_certificate /etc/letsencrypt/live/35-253-110-126.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/35-253-110-126.nip.io/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static {
        alias /opt/dental-worklog/static;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
