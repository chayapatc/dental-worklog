<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dental Worklog — link your LINE account</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d7d74' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M12 5.5c1.7-1.6 3.4-2.2 4.9-1.7 1.9.6 3.1 2.4 3.1 4.6 0 2-.7 3.3-1.2 5-.4 1.4-.6 3.1-1 4.4-.2.9-.7 1.7-1.4 1.7-.9 0-1.1-1.2-1.4-2.6-.3-1.4-.6-2.7-2-2.7s-1.7 1.3-2 2.7c-.3 1.4-.5 2.6-1.4 2.6-.7 0-1.2-.8-1.4-1.7-.4-1.3-.6-3-1-4.4-.5-1.7-1.2-3-1.2-5 0-2.2 1.2-4 3.1-4.6 1.5-.5 3.2.1 4.9 1.7Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/base.css?v={{ version }}">
<script>
  (function () {
    try {
      var t = localStorage.getItem("dw-theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<main class="status-page">
  <span class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5.5c1.7-1.6 3.4-2.2 4.9-1.7 1.9.6 3.1 2.4 3.1 4.6 0 2-.7 3.3-1.2 5-.4 1.4-.6 3.1-1 4.4-.2.9-.7 1.7-1.4 1.7-.9 0-1.1-1.2-1.4-2.6-.3-1.4-.6-2.7-2-2.7s-1.7 1.3-2 2.7c-.3 1.4-.5 2.6-1.4 2.6-.7 0-1.2-.8-1.4-1.7-.4-1.3-.6-3-1-4.4-.5-1.7-1.2-3-1.2-5 0-2.2 1.2-4 3.1-4.6 1.5-.5 3.2.1 4.9 1.7Z"/>
    </svg>
  </span>
  <h1>Dental Worklog</h1>

  <!-- Loading -->
  <div id="loading">
    <p>Opening…</p>
    <progress aria-label="Loading"></progress>
  </div>

  <!-- Already bound — logging in -->
  <div id="login-success" class="hidden">
    <p class="emoji" aria-hidden="true">✅</p>
    <p>Welcome back, <strong id="login-name"></strong>!</p>
    <p>Opening the app…</p>
  </div>

  <!-- Not bound — show bind flow -->
  <div id="not-bound" class="hidden">
    <p class="line-pill"><span aria-hidden="true">🟢</span><span id="line-name"></span></p>
    <p>Link your account to start logging shifts from chat.</p>
    <button id="bind-btn" class="btn btn--primary" type="button">Link account</button>
  </div>

  <!-- Binding in progress -->
  <div id="binding" class="hidden">
    <p class="emoji" aria-hidden="true">🔗</p>
    <p>Opening your browser…</p>
    <p class="fine">Sign in with Google to complete.</p>
  </div>

  <!-- Error -->
  <div id="error" class="hidden">
    <p class="emoji" aria-hidden="true">⚠️</p>
    <p id="error-msg"></p>
  </div>
</main>

<script>
let lineUserId = null;
let lineDisplayName = null;

async function init() {
  try {
    await liff.init({ liffId: "{{ liff_id }}" });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    lineUserId = profile.userId;
    lineDisplayName = profile.displayName;

    // Try auto-login — check if this LINE ID is already bound
    const loginRes = await fetch("/api/line/liff-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line_user_id: lineUserId }),
    });

    if (loginRes.ok) {
      const data = await loginRes.json();
      if (data.logged_in) {
        // Already bound — show welcome and redirect to app
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("login-name").textContent = data.user.name;
        document.getElementById("login-success").classList.remove("hidden");
        setTimeout(() => { window.location.href = "/"; }, 1000);
        return;
      }
    }

    // Not bound — show binding flow
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("line-name").textContent = lineDisplayName;
    document.getElementById("not-bound").classList.remove("hidden");

  } catch (err) {
    console.error(err);
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("error-msg").textContent =
      "Please open from inside the LINE app.";
    document.getElementById("error").classList.remove("hidden");
  }
}

document.getElementById("bind-btn").addEventListener("click", async () => {
  document.getElementById("not-bound").classList.add("hidden");
  document.getElementById("binding").classList.remove("hidden");

  try {
    const res = await fetch("/api/line/initiate-bind", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        line_user_id: lineUserId,
        line_display_name: lineDisplayName,
      }),
    });

    const data = await res.json();

    liff.openWindow({
      url: data.url,
      external: true,
    });

    setTimeout(() => {
      if (liff.isInClient && liff.isInClient()) liff.closeWindow();
    }, 1500);

  } catch (err) {
    document.getElementById("binding").classList.add("hidden");
    document.getElementById("error-msg").textContent = "Failed to start binding. Try again.";
    document.getElementById("error").classList.remove("hidden");
  }
});

init();
</script>
</body>
</html>
