<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bind LINE — Dental Worklog</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem; text-align: center; padding: 2rem 1rem;
  }
  .logo { font-size: 3rem; }
  p { max-width: 320px; opacity: 0.7; margin: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="logo">🦷</div>
<h2>Dental Worklog</h2>

<div id="loading">
  <p>Connecting to LINE…</p>
  <progress></progress>
</div>

<div id="error" class="hidden">
  <p style="font-size:2rem;">⚠️</p>
  <p id="error-msg"></p>
</div>

<div id="done" class="hidden">
  <p style="font-size:2rem;">🔗</p>
  <p>Opening your browser to finish binding…</p>
  <p style="font-size:0.8rem;opacity:0.5;">If nothing happens, close and try again.</p>
</div>

<script>
async function init() {
  try {
    // Init LIFF
    await liff.init({ liffId: "{{ liff_id }}" });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    const lineUserId = profile.userId;
    const lineDisplayName = profile.displayName;

    // Create binding token
    const res = await fetch("/api/line/initiate-bind", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        line_user_id: lineUserId,
        line_display_name: lineDisplayName,
      }),
    });

    if (!res.ok) {
      throw new Error("Failed to create binding token");
    }

    const data = await res.json();

    // Show done and open system browser
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("done").classList.remove("hidden");

    liff.openWindow({
      url: data.url,
      external: true,  // opens in system browser, not LINE WebView
    });

    // Close LIFF after a moment
    setTimeout(() => {
      if (liff.isInClient && liff.isInClient()) {
        liff.closeWindow();
      }
    }, 1500);

  } catch (err) {
    console.error(err);
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("error-msg").textContent =
      "Please open this page from inside the LINE app. Tap the link in LINE chat again.";
    document.getElementById("error").classList.remove("hidden");
  }
}

init();
</script>
</body>
</html>
