<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dental Worklog</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem; text-align: center; padding: 2rem 1rem;
  }
  .logo { font-size: 3rem; }
  p { max-width: 320px; opacity: 0.7; margin: 0; }
  .hidden { display: none !important; }
  .line-badge {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: #06c755; color: #fff; padding: 0.4rem 1rem;
    border-radius: 20px; font-size: 0.85rem; font-weight: 600;
  }
</style>
</head>
<body>

<div class="logo">🦷</div>
<h2>Dental Worklog</h2>

<!-- Loading -->
<div id="loading">
  <p>Opening…</p>
  <progress></progress>
</div>

<!-- Already bound — logging in -->
<div id="login-success" class="hidden">
  <p style="font-size:2rem;">✅</p>
  <p>Welcome back, <strong id="login-name"></strong>!</p>
  <p>Opening app…</p>
</div>

<!-- Not bound — show bind flow -->
<div id="not-bound" class="hidden">
  <div class="line-badge"><span>🟢</span> <span id="line-name"></span></div>
  <p>Link your account to start logging via chat</p>
  <button id="bind-btn" class="primary" style="font-size:1rem;padding:0.75rem 2rem;">Link Account</button>
</div>

<!-- Binding in progress -->
<div id="binding" class="hidden">
  <p style="font-size:2rem;">🔗</p>
  <p>Opening your browser…</p>
  <p style="font-size:0.8rem;opacity:0.5;">Sign in with Google to complete.</p>
</div>

<!-- Error -->
<div id="error" class="hidden">
  <p style="font-size:2rem;">⚠️</p>
  <p id="error-msg"></p>
</div>

<script>
let lineUserId = null;
let lineDisplayName = null;

async function init() {
  // Check for export action (CSV download from LIFF)
  const params = new URLSearchParams(location.search);
  const exportUrl = params.get("url");
  if (exportUrl && params.get("action") === "export") {
    try {
      await liff.init({ liffId: "{{ liff_id }}" });
      liff.openWindow({ url: exportUrl, external: true });
      setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 500);
    } catch {
      window.location.href = exportUrl;
    }
    return;
  }

  try {
    await liff.init({ liffId: "{{ liff_id }}" });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    lineUserId = profile.userId;
    lineDisplayName = profile.displayName;

    // Try auto-login — check if this LINE ID is already bound
    const loginRes = await fetch("/api/line/liff-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line_user_id: lineUserId }),
    });

    if (loginRes.ok) {
      const data = await loginRes.json();
      if (data.logged_in) {
        // Already bound — show welcome and redirect to app
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("login-name").textContent = data.user.name;
        document.getElementById("login-success").classList.remove("hidden");
        setTimeout(() => { window.location.href = "/"; }, 1000);
        return;
      }
    }

    // Not bound — show binding flow
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("line-name").textContent = lineDisplayName;
    document.getElementById("not-bound").classList.remove("hidden");

  } catch (err) {
    console.error(err);
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("error-msg").textContent =
      "Please open from inside the LINE app.";
    document.getElementById("error").classList.remove("hidden");
  }
}

document.getElementById("bind-btn").addEventListener("click", async () => {
  document.getElementById("not-bound").classList.add("hidden");
  document.getElementById("binding").classList.remove("hidden");

  try {
    const res = await fetch("/api/line/initiate-bind", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        line_user_id: lineUserId,
        line_display_name: lineDisplayName,
      }),
    });

    const data = await res.json();

    liff.openWindow({
      url: data.url,
      external: true,
    });

    setTimeout(() => {
      if (liff.isInClient && liff.isInClient()) liff.closeWindow();
    }, 1500);

  } catch (err) {
    document.getElementById("binding").classList.add("hidden");
    document.getElementById("error-msg").textContent = "Failed to start binding. Try again.";
    document.getElementById("error").classList.remove("hidden");
  }
});

init();
</script>
</body>
</html>
